# Publish the provider network mirror to GitHub Pages.
#
# The mirror protocol is static JSON, so Pages is a sufficient host:
#   /<registry-host>/jibey-fs/fspanos/index.json      versions
#   /<registry-host>/jibey-fs/fspanos/<version>.json  archives per os_arch
#
# Packages are keyed by registry hostname, and the default differs per CLI:
# tofu wants registry.opentofu.org, terraform wants registry.terraform.io. Both
# are published.
#
# The zips are NOT copied here -- the JSON points at the release assets, so a
# publish is a few KB. Consumers set:
#
#   provider_installation {
#     network_mirror { url = "https://jibey-fs.github.io/terraform-provider-fspanos/" }
#   }
#
# No GPG involved: the mirror protocol verifies by hash, taken from the
# SHA256SUMS the release workflow already produces.
#
# The same site also serves the provider REGISTRY protocol, which needs no CLI
# config at all (source = "jibey-fs.github.io/jibey-fs/fspanos"):
#   /v1/providers/jibey-fs/fspanos/versions
#   /v1/providers/jibey-fs/fspanos/<version>/download/<os>/<arch>
# https://jibey-fs.github.io/.well-known/terraform.json (the jibey-fs.github.io
# repo) points providers.v1 here. Download documents embed signing-key.asc so
# the CLI verifies the SHA256SUMS signature.

name: Mirror

# Release calls this after goreleaser succeeds: a release created with
# GITHUB_TOKEN does not fire `release: published`, so that trigger never ran.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish, e.g. 2.1.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish, e.g. 2.1.0"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      # Keep previously published versions so older releases stay installable.
      # A deploy replaces the whole site, so every <version>.json the current
      # index lists is carried over too. On the first publish there is no
      # index yet: nothing is seeded and build-mirror.py starts from empty.
      - name: Fetch current mirror
        continue-on-error: true
        env:
          MIRROR_URL: https://jibey-fs.github.io/terraform-provider-fspanos
        run: |
          for h in registry.opentofu.org registry.terraform.io; do
            path="$h/jibey-fs/fspanos"
            mkdir -p "site/$path"
            if ! curl -fsSL -o /tmp/index.json "$MIRROR_URL/$path/index.json"; then
              echo "no current index for $h, starting empty"
              continue
            fi
            if ! versions=$(python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["versions"]))' /tmp/index.json); then
              echo "::warning::current index for $h is not valid JSON, starting empty"
              continue
            fi
            cp /tmp/index.json "site/$path/index.json"
            for v in $versions; do
              curl -fsSL -o "site/$path/$v.json" "$MIRROR_URL/$path/$v.json" \
                || echo "::warning::$h $v.json missing from the current mirror"
            done
          done

      # Same carry-over for the registry documents: the current `versions`
      # plus every download document it lists.
      - name: Fetch current registry documents
        continue-on-error: true
        env:
          REGISTRY_URL: https://jibey-fs.github.io/terraform-provider-fspanos/v1/providers/jibey-fs/fspanos
          REGISTRY_DIR: site/v1/providers/jibey-fs/fspanos
        run: |
          mkdir -p "$REGISTRY_DIR"
          if ! curl -fsSL -o /tmp/versions "$REGISTRY_URL/versions"; then
            echo "no current registry versions, starting empty"
            exit 0
          fi
          if ! docs=$(python3 -c 'import json,sys; print("\n".join("/".join((v["version"], "download", p["os"], p["arch"])) for v in json.load(open(sys.argv[1]))["versions"] for p in v["platforms"]))' /tmp/versions); then
            echo "::warning::current registry versions is not valid, starting empty"
            exit 0
          fi
          cp /tmp/versions "$REGISTRY_DIR/versions"
          for doc in $docs; do
            mkdir -p "$REGISTRY_DIR/$(dirname "$doc")"
            curl -fsSL -o "$REGISTRY_DIR/$doc" "$REGISTRY_URL/$doc" \
              || echo "::warning::registry $doc missing from the current site"
          done

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ steps.v.outputs.version }}" -R "$GITHUB_REPOSITORY" \
            -p '*_SHA256SUMS' -O /tmp/SHA256SUMS --clobber

      - name: Build mirror index
        run: |
          python3 scripts/build-mirror.py \
            --version "${{ steps.v.outputs.version }}" \
            --sums /tmp/SHA256SUMS \
            --out site
          find site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
